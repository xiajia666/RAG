<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档问答 RAG</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e4e7ec;
    --text: #1f2329;
    --muted: #8a919f;
    --primary: #3b6ef6;
    --primary-hover: #2f5cd8;
    --user-bubble: #3b6ef6;
    --assistant-bubble: #ffffff;
    --danger: #e5484d;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 16px;
    font-weight: 600;
  }
  header .dot { color: var(--primary); margin-right: 8px; }
  .layout { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  aside section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  aside section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .btn {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    text-align: left;
  }
  .btn:hover { background: #f0f2f5; }
  .btn-primary { background: var(--primary); color: #fff; border: none; text-align: center; }
  .btn-primary:hover { background: var(--primary-hover); }
  .list { list-style: none; margin: 10px 0 0; padding: 0; }
  .list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .list li:hover { background: #f0f2f5; }
  .list li.active { background: #eaf0ff; color: var(--primary); }
  .list li .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list li .sub { color: var(--muted); font-size: 12px; }
  .del {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    visibility: hidden;
  }
  .list li:hover .del { visibility: visible; }
  .del:hover { color: var(--danger); background: #fbe9ea; }
  .empty-hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .sources { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .welcome {
    margin: auto;
    text-align: center;
    color: var(--muted);
  }
  .welcome h1 { color: var(--text); font-size: 22px; margin-bottom: 8px; }
  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .input-bar textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    min-height: 44px;
    max-height: 160px;
    outline: none;
  }
  .input-bar textarea:focus { border-color: var(--primary); }
  .input-bar button {
    padding: 0 22px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .input-bar button:hover { background: var(--primary-hover); }
  .input-bar button:disabled { opacity: .6; cursor: not-allowed; }
  .typing { color: var(--muted); }
</style>
</head>
<body>
<header><span class="dot">●</span>文档问答 RAG</header>

<div class="layout">
  <aside>
    <section>
      <h2>会话</h2>
      <button class="btn btn-primary" id="newSessionBtn">＋ 新建会话</button>
      <ul class="list" id="sessionsList"></ul>
    </section>
    <section>
      <h2>知识库文档</h2>
      <button class="btn" id="uploadBtn">📄 上传文档</button>
      <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md,.docx,.csv,.json,.py,.log" hidden>
      <ul class="list" id="docsList"></ul>
    </section>
  </aside>

  <main>
    <div class="messages" id="messages">
      <div class="welcome">
        <h1>上传文档，然后开始提问</h1>
        <p>支持 PDF / TXT / Markdown / DOCX。上传后即可针对文档内容对话。</p>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="input" placeholder="输入问题，回车发送，Shift+回车换行"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<script>
let currentSessionId = null;
let streaming = false;

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('input');
const sendBtn = $('sendBtn');
const sessionsList = $('sessionsList');
const docsList = $('docsList');

// ---------- 通用请求 ----------
async function api(url, opts = {}) {
  const resp = await fetch(url, opts);
  if (!resp.ok) {
    let msg = resp.statusText;
    try { const j = await resp.json(); msg = j.detail || j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return resp.json();
}

// ---------- 会话 ----------
async function loadSessions() {
  const sessions = await api('/api/session');
  sessionsList.innerHTML = '';
  if (!sessions.length) {
    sessionsList.innerHTML = '<div class="empty-hint">暂无会话</div>';
    return;
  }
  for (const s of sessions) {
    const li = document.createElement('li');
    if (s.id === currentSessionId) li.classList.add('active');
    li.innerHTML = `<span class="label">${escapeHtml(s.title)}</span><span class="sub">${s.message_count}条</span>`;
    li.addEventListener('click', () => selectSession(s.id));

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除会话';
    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('删除该会话？')) return;
      await api(`/api/session/${s.id}`, { method: 'DELETE' });
      if (currentSessionId === s.id) { currentSessionId = null; clearMessages(); }
      loadSessions();
    });
    li.appendChild(del);
    sessionsList.appendChild(li);
  }
}

async function newSession() {
  await api('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({})
  });
  currentSessionId = null;
  clearMessages();
  loadSessions();
}

async function selectSession(id) {
  currentSessionId = id;
  loadSessions();
  const s = await api(`/api/session/${id}`);
  renderMessages(s.messages || []);
}

function clearMessages() {
  messagesEl.innerHTML = '';
  appendWelcome();
}

function appendWelcome() {
  const w = document.createElement('div');
  w.className = 'welcome';
  w.innerHTML = '<h1>上传文档，然后开始提问</h1><p>支持 PDF / TXT / Markdown / DOCX。</p>';
  messagesEl.appendChild(w);
}

function renderMessages(messages) {
  messagesEl.innerHTML = '';
  if (!messages.length) { appendWelcome(); return; }
  for (const m of messages) {
    appendMessage(m.role === 'user' ? 'user' : 'assistant', m.content, null);
  }
}

// ---------- 文档 ----------
async function loadDocuments() {
  const docs = await api('/api/documents');
  docsList.innerHTML = '';
  if (!docs.length) {
    docsList.innerHTML = '<div class="empty-hint">暂无文档</div>';
    return;
  }
  for (const d of docs) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="label" title="${escapeHtml(d.filename)}">${escapeHtml(d.filename)}</span><span class="sub">${d.chunk_count}块</span>`;

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除文档';
    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(`删除文档「${d.filename}」？`)) return;
      await api(`/api/documents/${d.id}`, { method: 'DELETE' });
      loadDocuments();
    });
    li.appendChild(del);
    docsList.appendChild(li);
  }
}

async function uploadFiles(files) {
  for (const file of files) {
    const form = new FormData();
    form.append('file', file);
    try {
      const r = await api('/api/documents', { method: 'POST', body: form });
      // 简单提示
      console.log('已上传', r);
    } catch (e) {
      alert(`上传「${file.name}」失败：${e.message}`);
    }
  }
  loadDocuments();
}

// ---------- 消息 ----------
function appendMessage(role, text, sources) {
  const welcome = messagesEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text || '';
  wrap.appendChild(bubble);

  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.textContent = '来源：' + sources.map(x => x.filename).join('、');
    wrap.appendChild(s);
  }

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

// ---------- 发送 / 流式 ----------
async function sendMessage() {
  if (streaming) return;
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  appendMessage('user', text, null);

  let assistantBubble = appendMessage('assistant', '思考中…', null);
  assistantBubble.classList.add('typing');

  streaming = true;
  sendBtn.disabled = true;

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: currentSessionId })
    });

    if (!resp.ok || !resp.body) {
      const j = await resp.json().catch(() => ({}));
      throw new Error(j.detail || j.error || resp.statusText);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let firstContent = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const raw = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith('data:')) continue;
        const data = raw.slice(5).trim();
        if (data === '[DONE]') continue;

        let evt;
        try { evt = JSON.parse(data); } catch (e) { continue; }

        if (evt.type === 'meta') {
          if (evt.session_id) currentSessionId = evt.session_id;
          const src = evt.sources || [];
          if (src.length) {
            const prev = assistantBubble.parentElement.querySelector('.sources');
            if (!prev) {
              const s = document.createElement('div');
              s.className = 'sources';
              s.textContent = '来源：' + src.map(x => x.filename).join('、');
              assistantBubble.parentElement.appendChild(s);
            }
          }
        } else if (evt.type === 'content') {
          if (firstContent) {
            assistantBubble.textContent = '';
            assistantBubble.classList.remove('typing');
            firstContent = false;
          }
          assistantBubble.textContent += evt.text;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (evt.type === 'error') {
          assistantBubble.classList.remove('typing');
          assistantBubble.textContent = '出错了：' + evt.message;
        }
      }
    }

    if (firstContent && assistantBubble.textContent === '思考中…') {
      assistantBubble.textContent = '（无回复）';
    }
  } catch (e) {
    assistantBubble.classList.remove('typing');
    assistantBubble.textContent = '出错了：' + e.message;
  } finally {
    streaming = false;
    sendBtn.disabled = false;
    loadSessions();
  }
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ---------- 事件绑定 ----------
$('newSessionBtn').addEventListener('click', newSession);
$('uploadBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', (e) => {
  if (e.target.files.length) uploadFiles(e.target.files);
  e.target.value = '';
});
$('sendBtn').addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ---------- 初始化 ----------
loadSessions();
loadDocuments();
</script>
</body>
</html>
